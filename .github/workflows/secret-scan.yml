name: Secret scan

# gitleaks on every commit of every branch: on each pull request, on each push to the default branch
# and daily (a rule gitleaks adds in a later release shows up within a day). Same image and digest as
# the secret-scan jobs of Rodz-io/lead-tracker: bump them together.
#
# Findings that are known placeholders or test values are listed by fingerprint in `.gitleaksignore`
# (one per line, with the reason in a comment above the block). A NEW finding fails the job. The log
# and the summary give file, line, rule, commit and fingerprint, never the matched text.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 4 * * *"  # daily 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the full history
        env:
          # gitleaks' default walks every commit but prints no patch for a merge, so a secret added
          # while resolving a conflict would escape. --diff-merges=first-parent prints it and still
          # walks every parent.
          LOG_OPTS: --all --full-history --diff-merges=first-parent
        run: |
          set +e -uo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -v "$RUNNER_TEMP:/report" -w /repo "$GITLEAKS_IMAGE" \
            git --redact --no-banner --exit-code 1 \
            --report-format json --report-path /report/gitleaks.json \
            --log-opts="$LOG_OPTS" .
          rc=$?
          if [ "$rc" -ne 0 ] && [ -s "$RUNNER_TEMP/gitleaks.json" ]; then
            report="$RUNNER_TEMP/gitleaks.json"
            {
              echo "### gitleaks: $(jq length "$report") new finding(s)"
              echo
              echo "| Findings | Rule | File |"
              echo "| ---: | --- | --- |"
              jq -r 'group_by([.RuleID, .File])[] | "| \(length) | \(.[0].RuleID) | \(.[0].File) |"' "$report"
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "\(.File):\(.StartLine) \(.RuleID) \(.Commit[0:9]) \(.Fingerprint)"' "$report"
          fi
          exit "$rc"
